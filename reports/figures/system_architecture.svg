<svg viewBox="0 0 1500 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1E4A5A"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3D7189"/>
    </marker>
    <marker id="arrowBoth" markerWidth="10" markerHeight="10" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#3D7189"/>
    </marker>
  </defs>

  <rect width="1500" height="700" fill="#F7F4EC"/>

  <!-- specialist group -->
  <rect x="405" y="40" width="330" height="410" rx="10" fill="none" stroke="#3D7189" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="570" y="28" text-anchor="middle" font-size="16" fill="#3D7189" font-weight="bold">Specialist workers — run in parallel</text>

  <!-- START -->
  <rect x="30" y="200" width="140" height="90" rx="8" fill="#FFFFFF" stroke="#1E4A5A" stroke-width="2.5"/>
  <text x="100" y="234" text-anchor="middle" font-size="19" fill="#17323C" font-weight="bold">START</text>
  <text x="100" y="258" text-anchor="middle" font-size="13" fill="#4A6873">assessment</text>
  <text x="100" y="275" text-anchor="middle" font-size="13" fill="#4A6873">batch</text>

  <!-- Orchestrator -->
  <rect x="215" y="190" width="160" height="110" rx="8" fill="#1E4A5A" stroke="#1E4A5A" stroke-width="2.5"/>
  <text x="295" y="228" text-anchor="middle" font-size="19" fill="#FFFFFF" font-weight="bold">Orchestrator</text>
  <text x="295" y="252" text-anchor="middle" font-size="13" fill="#C9DCE4">deterministic</text>
  <text x="295" y="270" text-anchor="middle" font-size="13" fill="#C9DCE4">routing via Send</text>

  <!-- KYC -->
  <rect x="425" y="60" width="290" height="100" rx="8" fill="#FFFFFF" stroke="#3D7189" stroke-width="2.5"/>
  <text x="443" y="92" font-size="19" fill="#17323C" font-weight="bold">KYC Agent</text>
  <text x="443" y="118" font-size="13.5" fill="#4A6873">New / Existing / Dormant status</text>
  <text x="443" y="140" font-size="13.5" fill="#4A6873">Relationship depth from records on file</text>

  <!-- AML -->
  <rect x="425" y="195" width="290" height="100" rx="8" fill="#FFFFFF" stroke="#3D7189" stroke-width="2.5"/>
  <text x="443" y="227" font-size="19" fill="#17323C" font-weight="bold">AML Agent</text>
  <text x="443" y="253" font-size="13.5" fill="#4A6873">XGBoost + 8 BSA / FinCEN rules</text>
  <text x="443" y="275" font-size="13.5" fill="#4A6873">Graph-derived transaction features</text>

  <!-- CDA -->
  <rect x="425" y="330" width="290" height="100" rx="8" fill="#FFFFFF" stroke="#3D7189" stroke-width="2.5"/>
  <text x="443" y="362" font-size="19" fill="#17323C" font-weight="bold">CDA Agent</text>
  <text x="443" y="388" font-size="13.5" fill="#4A6873">XGBoost + 12 credit-policy rules</text>
  <text x="443" y="410" font-size="13.5" fill="#4A6873">SHAP attributions per decision</text>

  <!-- merge bar -->
  <rect x="765" y="40" width="55" height="410" rx="8" fill="#3D7189" stroke="#3D7189" stroke-width="2"/>
  <text x="792" y="245" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="bold" transform="rotate(-90 792 245)">merge · operator.add reducer</text>

  <!-- Explanation -->
  <rect x="870" y="190" width="170" height="110" rx="8" fill="#FFFFFF" stroke="#1E4A5A" stroke-width="2.5"/>
  <text x="955" y="226" text-anchor="middle" font-size="18" fill="#17323C" font-weight="bold">Explanation</text>
  <text x="955" y="248" text-anchor="middle" font-size="18" fill="#17323C" font-weight="bold">Agent</text>
  <text x="955" y="274" text-anchor="middle" font-size="13" fill="#4A6873">plain-English report</text>

  <!-- Audit -->
  <rect x="1085" y="190" width="170" height="110" rx="8" fill="#FFFFFF" stroke="#1E4A5A" stroke-width="2.5"/>
  <text x="1170" y="226" text-anchor="middle" font-size="18" fill="#17323C" font-weight="bold">Audit</text>
  <text x="1170" y="248" text-anchor="middle" font-size="18" fill="#17323C" font-weight="bold">Agent</text>
  <text x="1170" y="274" text-anchor="middle" font-size="13" fill="#4A6873">independent trail</text>

  <!-- END -->
  <rect x="1300" y="200" width="110" height="90" rx="8" fill="#1E4A5A" stroke="#1E4A5A" stroke-width="2.5"/>
  <text x="1355" y="252" text-anchor="middle" font-size="19" fill="#FFFFFF" font-weight="bold">END</text>

  <!-- Shared DB -->
  <rect x="425" y="505" width="290" height="95" rx="8" fill="#E4EDF1" stroke="#1E4A5A" stroke-width="2.5"/>
  <text x="570" y="536" text-anchor="middle" font-size="18" fill="#17323C" font-weight="bold">Shared Customer Database</text>
  <text x="570" y="561" text-anchor="middle" font-size="13.5" fill="#4A6873">customers · credit_applications</text>
  <text x="570" y="580" text-anchor="middle" font-size="13.5" fill="#4A6873">transactions</text>

  <!-- Memory DB -->
  <rect x="1085" y="505" width="170" height="95" rx="8" fill="#E4EDF1" stroke="#1E4A5A" stroke-width="2.5"/>
  <text x="1170" y="536" text-anchor="middle" font-size="17" fill="#17323C" font-weight="bold">System Memory</text>
  <text x="1170" y="560" text-anchor="middle" font-size="13" fill="#4A6873">checkpointer +</text>
  <text x="1170" y="578" text-anchor="middle" font-size="13" fill="#4A6873">agent_history</text>

  <!-- arrows: main spine -->
  <line x1="170" y1="245" x2="207" y2="245" stroke="#1E4A5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 375 235 C 398 235, 398 110, 417 110" fill="none" stroke="#1E4A5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="245" x2="417" y2="245" stroke="#1E4A5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 375 255 C 398 255, 398 380, 417 380" fill="none" stroke="#1E4A5A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="715" y1="110" x2="757" y2="110" stroke="#3D7189" stroke-width="2.5" marker-end="url(#arrowLight)"/>
  <line x1="715" y1="245" x2="757" y2="245" stroke="#3D7189" stroke-width="2.5" marker-end="url(#arrowLight)"/>
  <line x1="715" y1="380" x2="757" y2="380" stroke="#3D7189" stroke-width="2.5" marker-end="url(#arrowLight)"/>

  <line x1="820" y1="245" x2="862" y2="245" stroke="#1E4A5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1040" y1="245" x2="1077" y2="245" stroke="#1E4A5A" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1255" y1="245" x2="1292" y2="245" stroke="#1E4A5A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- db links -->
  <line x1="570" y1="497" x2="570" y2="458" stroke="#3D7189" stroke-width="2.5" marker-end="url(#arrowLight)" marker-start="url(#arrowBoth)"/>
  <text x="590" y="482" font-size="13" fill="#3D7189">all three specialists query one shared view</text>

  <line x1="1170" y1="300" x2="1170" y2="497" stroke="#1E4A5A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- caption -->
  <text x="30" y="655" font-size="15" fill="#17323C" font-weight="bold">LangGraph StateGraph</text>
  <text x="30" y="678" font-size="14" fill="#4A6873">Parallel fan-out via Send · parallel branches merged by operator.add reducer · SqliteSaver checkpointing makes every run resumable and auditable</text>
</svg>
